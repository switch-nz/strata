[package]
name = "strata-native-crypto"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Native sidecar for Strata: AES-XTS/CBC decrypt, Argon2, Marvin32 and fuzzy hashing"

[lib]
name = "strata_native"
crate-type = ["cdylib"]

[dependencies]
aes = { version = "0.8", default-features = false }
argon2 = { version = "0.5", default-features = false, features = ["alloc"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true