name: Feature request
description: Something the tool should be able to do
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: >
        What are you trying to find out, and where does the tool currently
        stop you? Describe the examination, not the feature.
      placeholder: |
        When a volume is …, there is no way to tell whether …, so I have to ….
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you have in mind
      description: Optional. If you already have a shape for it, describe it here.
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: How you handle it today
      description: >
        Another tool, a manual step, or going without. Useful for judging how
        much this is worth.
    validations:
      required: false

  - type: checkboxes
    id: constraints
    attributes:
      label: Constraints
      description: >
        Strata depends on nothing but the Python standard library and never
        touches the network. See CONTRIBUTING.md.
      options:
        - label: This can be done without adding a third-party dependency, or I have said below why one is warranted.
          required: false
