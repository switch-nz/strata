name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to attach native sidecars to"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  syntax:
    name: Syntax checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Byte-compile all Python sources
        run: python3 -m compileall -q engine run.py
      - name: Check the web frontend parses
        run: |
          node --check web/app.js
          node --check web/strings.js
      - name: Check every string file is valid JSON
        run: |
          python3 - <<'PY'
          import json, pathlib, sys
          bad = []
          files = sorted(pathlib.Path("web/strings").rglob("*.json"))
          for p in files:
              try:
                  json.loads(p.read_text(encoding="utf-8"))
              except Exception as exc:
                  bad.append("%s: %s" % (p, exc))
          for line in bad:
              print(line)
          print("checked %d string files" % len(files))
          sys.exit(1 if bad else 0)
          PY

  smoke:
    name: Smoke test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      # Per version, not just once: this is what keeps the README's
      # "Python 3.8 or later" true when newer syntax creeps in.
      - name: Byte-compile on this version
        run: python -m compileall -q engine run.py
      - name: Run the app and exercise it over HTTP
        run: python tests/smoke.py

  unittest:
    name: Unit tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.8", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Run unit tests
        env:
          # CI machines have no committed native binaries for every
          # runner; the loader's escape hatch proves the pure-Python
          # fallback contract stays green without them.
          STRATA_FORCE_PURE: "1"
        run: python -m unittest discover -s tests -p "test_*.py" -v

  native-build:
    name: Native sidecar (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          # Native arm64 runner: rustc 1.98 always passes
          # -Wl,--fix-cortex-a53-843419 when cross-linking from x86_64
          # (pre-link-arg in the target spec), and the x86_64-hosted
          # rust-lld that `cc -fuse-ld=lld` picks up rejects it.  Building
          # on the target arch avoids the flag entirely.
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build release cdylib
        run: cargo build --release --target ${{ matrix.target }}
        working-directory: native
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: strata-native-${{ matrix.target }}
          path: |
            native/target/${{ matrix.target }}/release/libstrata_native.so
            native/target/${{ matrix.target }}/release/libstrata_native.dylib
            native/target/${{ matrix.target }}/release/strata_native.dll
          if-no-files-found: error

  native-release:
    # Packages the built sidecars as one zip laid out as engine/native/
    # <target>/<soname> (extract it at the repo root and the loader finds
    # them) and attaches it, with a checksum, to an existing release. Only
    # runs when dispatched with a tag: .github/scripts/release.sh dispatches
    # it for every release it cuts, and it can be run by hand for an older
    # tag. (A release created with GITHUB_TOKEN cannot trigger a `release`
    # event workflow, so there is deliberately no such trigger.)
    #
    # One zip, not one asset per file: the five targets produce only three
    # distinct file names (libstrata_native.so for both Linux targets,
    # libstrata_native.dylib for both macOS ones), which as separate assets
    # would overwrite each other.
    name: Attach sidecars to release
    runs-on: ubuntu-latest
    needs: native-build
    if: github.event_name == 'workflow_dispatch' && inputs.tag != ''
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Stage engine/native layout
        run: |
          mkdir -p stage
          for d in artifacts/strata-native-*; do
            t=${d#artifacts/strata-native-}
            mkdir -p "stage/engine/native/$t"
            cp "$d"/* "stage/engine/native/$t/"
          done
          find stage -type f
      - name: Package and attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          zip_name="strata-native-$TAG.zip"
          (cd stage && zip -r -X "../$zip_name" engine)
          sha256sum "$zip_name" > "$zip_name.sha256"
          unzip -l "$zip_name"
          gh release upload "$TAG" "$zip_name" "$zip_name.sha256"             --repo "$GITHUB_REPOSITORY" --clobber
